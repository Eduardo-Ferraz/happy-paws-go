<text x="66.0" y="716.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">Herança Pessoa → Dentista/Paciente mapeada como tabela por classe:</text>
<text x="66.0" y="731.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">pessoa guarda os dados comuns e dentista/paciente têm a mesma chave,</text>
<text x="66.0" y="746.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">que é primária e estrangeira ao mesmo tempo. Assim telefone referencia</text>
<text x="66.0" y="761.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">uma única tabela (pessoa) e um e-mail de paciente nunca colide com o de</text>
<text x="66.0" y="776.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">um dentista.</text>
<path d="M 60.0 960.0 L 446.0 960.0 L 460.0 974.0 L 460.0 1017.0 L 60.0 1017.0 Z" fill="#FFFFCC" stroke="#999999" stroke-width="1"/>
<path d="M 446.0 960.0 L 446.0 974.0 L 460.0 974.0" fill="none" stroke="#999999" stroke-width="1"/>
<text x="66.0" y="976.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">Endereço virou colunas de pessoa (objeto-valor, sem identidade própria);</text>
<text x="66.0" y="991.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">telefones, por serem multivalorados, viraram tabela à parte; as duas</text>
<text x="66.0" y="1006.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">associações N:N viraram tabelas associativas com chave primária composta.</text>
</svg>