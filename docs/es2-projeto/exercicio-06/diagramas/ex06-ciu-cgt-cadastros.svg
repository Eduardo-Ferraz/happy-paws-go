<text x="46.0" y="846.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">Uma classe controladora por conjunto coeso de casos de uso: CtrlCadastro</text>
<text x="46.0" y="861.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">trata todos os cadastros (dentistas, especialidades e serviços, do</text>
<text x="46.0" y="876.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">Administrador; pacientes, das Atendentes). As janelas de consulta levam</text>
<text x="46.0" y="891.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">às de cadastro (seta de navegação).</text>
<path d="M 620.0 830.0 L 1166.0 830.0 L 1180.0 844.0 L 1180.0 902.0 L 620.0 902.0 Z" fill="#FFFFCC" stroke="#999999" stroke-width="1"/>
<path d="M 1166.0 830.0 L 1166.0 844.0 L 1180.0 844.0" fill="none" stroke="#999999" stroke-width="1"/>
<text x="626.0" y="846.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">Classes Apl (cgt): uma por caso de uso de gerenciamento, com as quatro</text>
<text x="626.0" y="861.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">operações dos fluxos básicos (incluir, consultar, alterar e excluir).</text>
<text x="626.0" y="876.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">Elas são o único ponto de entrada da lógica de negócio: a controladora</text>
<text x="626.0" y="891.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">não acessa o cdp nem o cgd diretamente.</text>
</svg>