<path d="M 470.0 700.0 L 1016.0 700.0 L 1030.0 714.0 L 1030.0 802.0 L 470.0 802.0 Z" fill="#FFFFCC" stroke="#999999" stroke-width="1"/>
<path d="M 1016.0 700.0 L 1016.0 714.0 L 1030.0 714.0" fill="none" stroke="#999999" stroke-width="1"/>
<text x="476.0" y="716.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">Regras tratadas no cgt, porque dependem de mais de um objeto:</text>
<text x="476.0" y="731.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">RI-2 — incluirItem() e excluirItem() verificam se o dentista autenticado</text>
<text x="476.0" y="746.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">é o responsável pelo tratamento;</text>
<text x="476.0" y="761.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">RI-3 — excluirItem() recusa item já iniciado;</text>
<text x="476.0" y="776.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">RI-6 — incluirItem() verifica se o dentista indicado atua em alguma</text>
<text x="476.0" y="791.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">especialidade habilitada para o serviço.</text>
<path d="M 1060.0 700.0 L 1586.0 700.0 L 1600.0 714.0 L 1600.0 772.0 L 1060.0 772.0 Z" fill="#FFFFCC" stroke="#999999" stroke-width="1"/>
<path d="M 1586.0 700.0 L 1586.0 714.0 L 1600.0 714.0" fill="none" stroke="#999999" stroke-width="1"/>
<text x="1066.0" y="716.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">excluirTratamentosNaoIniciados() trata a RI-5 (tratamento não iniciado</text>
<text x="1066.0" y="731.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">em 6 meses da avaliação é excluído). É a única operação que não parte de</text>
<text x="1066.0" y="746.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">uma janela: ela é disparada por uma rotina periódica do sistema, e por</text>
<text x="1066.0" y="761.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000000">isso aparece ligada apenas à classe de aplicação.</text>
</svg>